name: iOS CI/CD Pipeline

# Триггеры: запуск при создании Pull Request в ветки development и production
on:
  pull_request:
    branches:
      - development
      - production

# Определение переменных окружения для всего пайплайна
env:
  PROJECT_NAME: lab9
  SCHEME_NAME: lab9
  SIMULATOR_NAME: iPhone 16

jobs:
  # Основная работа CI/CD
  build-and-test:
    # Виртуальная машина: macOS с последней версией
    runs-on: macos-latest
    timeout-minutes: 20
    
    steps:
      # Шаг 1: Checkout репозитория
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Шаг 1.5: Подготовка окружения для подписи и тестирования (предотвращает зависания codesign)
      - name: Prepare Signing and Testing Environment
        run: |
          # Разблокировка связки ключей macOS для беспрепятственного codesign
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db || true
          security set-keychain-settings -t 3600 -u ~/Library/Keychains/login.keychain-db || true
          # Удаление расширенных файловых атрибутов для избежания ошибок ресурсов
          xattr -cr .

      # Шаг 2: Установка зависимостей (если используется CocoaPods)
      - name: Setup CocoaPods Dependencies
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      # Шаг 3: Вывод информации об окружении
      - name: Display System Information
        run: |
          xcodebuild -version
          xcrun simctl list devices

      # Шаг 3.2: Динамический выбор симулятора
      - name: Select iOS Simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices | grep -E "iPhone" | grep -v "unavailable" | head -n 1 | sed -E 's/^[[:space:]]*//; s/[[:space:]]*\(.*//')
          echo "Selected simulator: $SIMULATOR"
          echo "SIMULATOR_NAME=$SIMULATOR" >> $GITHUB_ENV

      # Шаг 3.5: Предварительный запуск симулятора (избегает зависания UI-тестов)
      - name: Boot Simulator
        run: |
          xcrun simctl boot "${{ env.SIMULATOR_NAME }}" || true
          xcrun simctl bootstatus "${{ env.SIMULATOR_NAME }}" -boot || true

      # Шаг 4: Запуск Unit тестов
      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project ${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME_NAME }} \
            -destination 'platform=iOS Simulator,name=${{ env.SIMULATOR_NAME }}' \
            -configuration Debug \
            -only-testing:lab9Tests \
            -enableCodeCoverage YES
        continue-on-error: false

      # Шаг 5: Запуск UI тестов
      - name: Run UI Tests
        run: |
          xcodebuild test \
            -project ${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME_NAME }} \
            -destination 'platform=iOS Simulator,name=${{ env.SIMULATOR_NAME }}' \
            -configuration Debug \
            -only-testing:lab9UITests
        continue-on-error: true

      # Шаг 6: Финальная сборка (Build) — выполняется только при успешных тестах
      - name: Build Application
        if: success()
        run: |
          xcodebuild build \
            -project ${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME_NAME }} \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      # Шаг 7: Анализ кода (опционально, но рекомендуется)
      - name: Run SwiftLint (if available)
        run: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "SwiftLint not installed, skipping linting"
          fi
        continue-on-error: true

      # Шаг 8: Загрузка отчета о покрытии кода (опционально)
      - name: Upload Code Coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      # Шаг 9: Уведомление о результате (опционально)
      - name: Notify Build Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ CI/CD Pipeline completed successfully!"
          else
            echo "❌ CI/CD Pipeline failed. Check logs for details."
          fi
